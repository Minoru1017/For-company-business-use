name: Build Call Coach Assistant (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo-workspace/**"
      - ".github/workflows/build-assistant.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo-workspace

    steps:
      - uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        shell: bash
        working-directory: .
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=assistant-v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows app package
        shell: pwsh
        run: ./build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CallCoachAssistant-Windows
          path: demo-workspace/dist/CallCoachAssistant-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Call Coach Assistant Windows v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Call Coach 本機轉錄助手（Windows）

            免安裝 Python、不需 winget，適合公司電腦。

            ### 使用方式

            1. 下載 **`CallCoachAssistant-Windows.zip`**
            2. 解壓到任意資料夾
            3. 雙擊 **`CallCoachAssistant.exe`**，保持視窗開啟
            4. 開啟 [Call Coach](https://minoru1017.github.io/For-company-business-use/) → **DEMO · 轉錄** → **完整環境安裝**

            ### 說明

            - 首次「完整環境安裝」會下載 WhisperX 與模型（約 1～3 GB）
            - 建議另行安裝 ffmpeg（`winget install Gyan.FFmpeg`）以加速長影片轉錄

            **Commit:** ${{ github.sha }}
          files: demo-workspace/dist/CallCoachAssistant-Windows.zip
          make_latest: true
          draft: false
