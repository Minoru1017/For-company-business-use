name: Build Call Coach Assistant (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo-workspace/**"
      - ".github/workflows/build-assistant.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo-workspace

    steps:
      - uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        shell: bash
        working-directory: .
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=assistant-v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer and package
        shell: pwsh
        env:
          # Optional: set these repository secrets to produce Authenticode-signed artifacts
          # (Setup.exe, uninstaller, CallCoachAssistant.exe, ffmpeg/ffprobe). Build stays
          # unsigned when absent. Which certificate satisfies Smart App Control (public CA,
          # RSA) vs. internal trust only (self-signed / ServBay): see demo-workspace/CODESIGN.md
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
        run: ./build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CallCoachAssistant-Windows
          path: |
            demo-workspace/dist/CallCoachAssistant-Setup.exe
            demo-workspace/dist/CallCoachAssistant-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Call Coach Assistant Windows v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Call Coach 本機轉錄助手（Windows）

            ### 公司電腦（推薦）— 安裝精靈

            1. 下載 **`CallCoachAssistant-Setup.exe`**
            2. 執行安裝精靈（建議使用預設位置 `C:\CallCoachAssistant`）
            3. 安裝過程會自動準備 ffmpeg 與 WhisperX（約 5～15 分鐘，需網路）
            4. 從開始選單啟動 **Call Coach 本機助手**
            5. 開啟 [Call Coach](https://minoru1017.github.io/For-company-business-use/) → **DEMO · 轉錄** → 貼上 HF_TOKEN

            不需 `.cmd`、不需 winget、不需自行安裝 Python。

            > **Windows 11 Smart App Control** 開啟時會封鎖未簽章程式。若看到「已封鎖此應用程式的部分功能」，請改用 DEMO 的「Azure 雲端轉錄」模式，或請 IT 關閉 Smart App Control（關閉後無法再開啟）。

            ### 進階 — ZIP 免安裝版

            下載 `CallCoachAssistant-Windows.zip`，解壓後雙擊 `啟動 Call Coach.cmd`（部分公司電腦可能封鎖 .cmd）。

            **Commit:** ${{ github.sha }}
          files: |
            demo-workspace/dist/CallCoachAssistant-Setup.exe
            demo-workspace/dist/CallCoachAssistant-Windows.zip
          make_latest: true
          draft: false
