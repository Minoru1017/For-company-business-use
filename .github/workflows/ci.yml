name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      # 去識別公開版：建置 → 外洩檢查 → 冒煙測試；原始碼匯出也要通過外洩檢查
      - run: npm run check:public
      - run: npm run export:public
      - uses: actions/upload-artifact@v4
        with:
          name: call-coach-public-site
          path: dist-public
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: call-coach-public-source
          path: public-export
          retention-days: 14
